name: Validate Lab Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Verify Documentation Structure
      run: |
        echo "Verifying lab files in the repository..."
        ls -la
        echo "CI Validation Check Passed Successfully!"